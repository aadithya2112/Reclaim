services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: recovery
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery
    ports:
      - "5432:5432"
    volumes:
      - recovery-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery -d recovery"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  recovery-postgres-data:
